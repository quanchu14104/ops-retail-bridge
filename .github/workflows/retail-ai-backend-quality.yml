name: Retail-AI backend quality

# Retail-AI nằm ở thư mục Retail-AI-/ của repo bridge: chỉ chạy khi phần đó (hoặc chính workflow này) đổi.
on:
  push:
    branches: [main]
    paths:
      - Retail-AI-/**
      - .github/workflows/retail-ai-backend-quality.yml
  pull_request:
    branches: [main]
    paths:
      - Retail-AI-/**
      - .github/workflows/retail-ai-backend-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Retail-AI-
    env:
      CATALOG_REPOSITORY: demo
      GROQ_API_KEY: ""
      AZURE_SPEECH_KEY: ""
      ELEVENLABS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          working-directory: Retail-AI-
          cache-dependency-glob: Retail-AI-/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint backend, tests, and evaluations
        run: uv run ruff check backend tests evaluation
      - name: Run offline backend suite
        run: uv run pytest tests -q --tb=short
      - name: Compile Python sources
        run: uv run python -m compileall -q backend tests evaluation
