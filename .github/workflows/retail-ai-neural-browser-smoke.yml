name: Retail-AI neural browser smoke

# Trước đây chỉ chạy trên nhánh codex/voice-silence-gate-streaming-20261020 của repo Retail-AI riêng (không có ở
# repo bridge). Nay chạy khi đúng các file của VAD neural đổi.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retail-ai-neural-browser-smoke.yml
      - Retail-AI-/apps/kiosk-airi/vite.config.ts
      - Retail-AI-/apps/kiosk-airi/scripts/smoke-neural-browser.mjs
      - Retail-AI-/apps/kiosk-airi/src/voice-neural.ts
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/retail-ai-neural-browser-smoke.yml
      - Retail-AI-/apps/kiosk-airi/vite.config.ts
      - Retail-AI-/apps/kiosk-airi/scripts/smoke-neural-browser.mjs
      - Retail-AI-/apps/kiosk-airi/src/voice-neural.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neural-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Retail-AI-/apps/kiosk-airi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Retail-AI-/apps/kiosk-airi/package-lock.json
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - run: npm run predev
      - name: Load real local ONNX neural VAD in Chromium with synthetic mic
        run: node scripts/smoke-neural-browser.mjs
